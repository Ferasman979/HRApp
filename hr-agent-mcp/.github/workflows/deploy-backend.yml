name: Deploy Backend Agents to ACA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: hrappacrferas999
  RG_NAME: hr-app-rg

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      # Build MCP Agent
      - name: Build and Push MCP Agent
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ env.ACR_NAME }}.azurecr.io/mcp-agent:${{ github.sha }},${{ env.ACR_NAME }}.azurecr.io/mcp-agent:latest

      # Deploy Processor
      - name: Deploy Processor to Container App
        run: |
          az containerapp update \
            --name hr-mcp-processor \
            --resource-group ${{ env.RG_NAME }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/mcp-agent:${{ github.sha }} \
            --command "npm" "run" "worker"

      # Deploy Researcher
      - name: Deploy Researcher to Container App
        run: |
          az containerapp update \
            --name hr-mcp-researcher \
            --resource-group ${{ env.RG_NAME }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/mcp-agent:${{ github.sha }} \
            --command "npm" "run" "research"
