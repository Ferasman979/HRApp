name: Deploy to Azure

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ARM_CLIENT_ID: ${{ steps.creds.outputs.clientId }}
  ARM_SUBSCRIPTION_ID: ${{ steps.creds.outputs.subscriptionId }}
  ARM_TENANT_ID: ${{ steps.creds.outputs.tenantId }}


jobs:
  # 1. Infrastructure Checks & Base Setup
  infra-check:
    runs-on: ubuntu-latest
    outputs:
      acr_server: ${{ steps.get_acr.outputs.acr_server }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ./infrastructure/terraform
        run: terraform init

      - name: Create terraform.tfvars
        working-directory: ./infrastructure/terraform
        run: echo "${{ secrets.TFVARS_FILE }}" > terraform.tfvars

      # Ensure ACR exists so we can push to it.
      # We target ONLY the ACR resource.
      - name: Ensure ACR Exists
        working-directory: ./infrastructure/terraform
        run: terraform apply -target="azurerm_container_registry.acr" -auto-approve


      - name: Get ACR Login Server
        id: get_acr
        working-directory: ./infrastructure/terraform
        run: |
          ACR_SERVER=$(terraform output -raw acr_login_server)
          echo "acr_server=$ACR_SERVER" >> $GITHUB_OUTPUT

  # 2. Parallel Build & Push
  build-and-push:
    needs: infra-check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: frontend
            context: ./nextjs-hrapp-project
            image: hr-app-frontend
          - name: agent
            context: ./hr-agent-mcp
            image: hr-agent-mcp
          - name: prometheus
            context: ./monitoring/prometheus
            image: prometheus-custom
          - name: tempo
            context: ./monitoring/tempo
            image: tempo-custom
          - name: grafana
            context: ./monitoring/grafana
            image: grafana-custom
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        run: |
          az acr login --name ${{ needs.infra-check.outputs.acr_server }}

      - name: Build and Push ${{ matrix.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ needs.infra-check.outputs.acr_server }}/${{ matrix.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 3. Deploy App (Full Terraform Apply)
  deploy:
    needs: [infra-check, build-and-push]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ./infrastructure/terraform
        run: terraform init

      - name: Create terraform.tfvars
        working-directory: ./infrastructure/terraform
        run: echo "${{ secrets.TFVARS_FILE }}" > terraform.tfvars

      - name: Terraform Apply (Full)
        working-directory: ./infrastructure/terraform
        run: terraform apply -auto-approve
