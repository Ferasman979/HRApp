name: Deploy to Azure (Sequential)

on:
  push:
    branches: [ "main", "dev" ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: hrappterraformferas
  RG_NAME: hr-app-rg-terraform

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      # --- BUILD STEPS (Sequential) ---
      
      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./nextjs-hrapp-project
          push: true
          tags: ${{ env.ACR_NAME }}.azurecr.io/hr-app-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Agent
        uses: docker/build-push-action@v5
        with:
          context: ./hr-agent-mcp
          push: true
          tags: ${{ env.ACR_NAME }}.azurecr.io/hr-agent-mcp:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Prometheus
        uses: docker/build-push-action@v5
        with:
          context: ./monitoring/prometheus
          push: true
          tags: ${{ env.ACR_NAME }}.azurecr.io/prometheus-custom:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Tempo
        uses: docker/build-push-action@v5
        with:
          context: ./monitoring/tempo
          push: true
          tags: ${{ env.ACR_NAME }}.azurecr.io/tempo-custom:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Grafana
        uses: docker/build-push-action@v5
        with:
          context: ./monitoring/grafana
          push: true
          tags: ${{ env.ACR_NAME }}.azurecr.io/grafana-custom:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- DEPLOY STEPS ---

      - name: Deploy Frontend
        run: |
          az containerapp update \
            --name hr-app-frontend \
            --resource-group ${{ env.RG_NAME }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/hr-app-frontend:${{ github.sha }}

      - name: Deploy Agent (Processor)
        run: |
          az containerapp update \
            --name hr-mcp-processor \
            --resource-group ${{ env.RG_NAME }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/hr-agent-mcp:${{ github.sha }}

      - name: Deploy Agent (Researcher)
        run: |
          az containerapp update \
            --name hr-mcp-researcher \
            --resource-group ${{ env.RG_NAME }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/hr-agent-mcp:${{ github.sha }}

      - name: Deploy Prometheus
        run: |
          az containerapp update \
            --name hr-app-prometheus \
            --resource-group ${{ env.RG_NAME }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/prometheus-custom:${{ github.sha }}

      - name: Deploy Grafana
        run: |
          az containerapp update \
            --name hr-app-grafana \
            --resource-group ${{ env.RG_NAME }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/grafana-custom:${{ github.sha }}

      - name: Deploy Tempo
        run: |
          az containerapp update \
            --name hr-app-tempo \
            --resource-group ${{ env.RG_NAME }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/tempo-custom:${{ github.sha }}
