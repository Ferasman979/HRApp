name: Deploy Monitoring Infrastructure

on:
  workflow_dispatch:
  push:
    paths:
      - 'monitoring/**'

env:
  RG_NAME: hr-app-rg
  ENV_NAME: hr-app-env
  ACR_NAME: hrappacrferas999

jobs:
  deploy-monitoring:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: ACR Login
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build & Deploy Prometheus
        run: |
          # 1. Fetch Backend URLs
          FRONTEND_URL=$(az containerapp show --name hr-app-frontend --resource-group ${{ env.RG_NAME }} --query properties.configuration.ingress.fqdn -o tsv)
          PROCESSOR_URL=$(az containerapp show --name hr-mcp-processor --resource-group ${{ env.RG_NAME }} --query properties.configuration.ingress.fqdn -o tsv)
          RESEARCHER_URL=$(az containerapp show --name hr-mcp-researcher --resource-group ${{ env.RG_NAME }} --query properties.configuration.ingress.fqdn -o tsv)

          # 2. Generate Config
          sed -e "s/__FRONTEND_HOST__/$FRONTEND_URL/g" \
              -e "s/__PROCESSOR_HOST__/$PROCESSOR_URL/g" \
              -e "s/__RESEARCHER_HOST__/$RESEARCHER_URL/g" \
              monitoring/prometheus/prometheus.template.yml > monitoring/prometheus/prometheus.yml

          # 3. Build & Push
          az acr build --registry ${{ env.ACR_NAME }} --image prometheus-custom:latest monitoring/prometheus

          # 4. Deploy Prometheus App
          az containerapp update \
            --name hr-app-prometheus \
            --resource-group ${{ env.RG_NAME }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/prometheus-custom:latest

      - name: Build & Deploy Grafana
        run: |
          # 1. Fetch Prometheus URL
          PROMETHEUS_URL=$(az containerapp show --name hr-app-prometheus --resource-group ${{ env.RG_NAME }} --query properties.configuration.ingress.fqdn -o tsv)

          # 2. Generate Config
          sed "s|__PROMETHEUS_URL__|https://$PROMETHEUS_URL|g" monitoring/grafana/datasources.template.yml > monitoring/grafana/datasources.yml
          
          # Copy dashboard files to context root for Docker build
          cp monitoring/grafana/mcp_dashboard.json monitoring/grafana/frontend_dashboard.json monitoring/grafana/dashboards.yml monitoring/grafana/
          
          # 3. Build & Push
          az acr build --registry ${{ env.ACR_NAME }} --image grafana-custom:latest monitoring/grafana

          # 4. Deploy Grafana App
          az containerapp update \
            --name hr-app-grafana \
            --resource-group ${{ env.RG_NAME }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/grafana-custom:latest \
            --set-env-vars GF_SECURITY_ALLOW_EMBEDDING=true GF_AUTH_ANONYMOUS_ENABLED=true GF_AUTH_ANONYMOUS_ORG_ROLE=Admin GF_AUTH_DISABLE_LOGIN_FORM=false

