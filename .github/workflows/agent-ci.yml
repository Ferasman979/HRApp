
name: HR Agent CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'hr-agent-mcp/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'hr-agent-mcp/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hr-agent-mcp

    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build Docker Image
      uses: docker/build-push-action@v4
      with:
        context: ./hr-agent-mcp
        push: false
        tags: hr-agent:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
