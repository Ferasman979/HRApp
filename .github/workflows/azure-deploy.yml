name: Build and Deploy to ACA

on:
  push:
    branches: [ "dev" ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: hrappterraformferas  # Matches Terraform
  RG_NAME: hr-app-rg-terraform   # Matches Terraform

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      # Build Frontend
      - name: Build and Push Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./nextjs-hrapp-project
          push: true
          tags: ${{ env.ACR_NAME }}.azurecr.io/hr-app-frontend:${{ github.sha }},${{ env.ACR_NAME }}.azurecr.io/hr-app-frontend:latest

      # Build MCP Agent
      - name: Build and Push MCP Agent
        uses: docker/build-push-action@v4
        with:
          context: ./hr-agent-mcp
          push: true
          tags: ${{ env.ACR_NAME }}.azurecr.io/hr-agent-mcp:${{ github.sha }},${{ env.ACR_NAME }}.azurecr.io/hr-agent-mcp:latest

      # Build OTel Collector (Custom)
      - name: Build and Push OTel Collector
        uses: docker/build-push-action@v4
        with:
          context: ./monitoring/otel
          push: true
          tags: ${{ env.ACR_NAME }}.azurecr.io/otel-collector-custom:${{ github.sha }},${{ env.ACR_NAME }}.azurecr.io/otel-collector-custom:latest

      # Build Grafana (Custom)
      - name: Build and Push Grafana
        uses: docker/build-push-action@v4
        with:
          context: ./monitoring/grafana
          push: true
          tags: ${{ env.ACR_NAME }}.azurecr.io/grafana-custom:${{ github.sha }},${{ env.ACR_NAME }}.azurecr.io/grafana-custom:latest

      # Build Tempo (Custom)
      - name: Build and Push Tempo
        uses: docker/build-push-action@v4
        with:
          context: ./monitoring/tempo
          push: true
          tags: ${{ env.ACR_NAME }}.azurecr.io/tempo-custom:${{ github.sha }},${{ env.ACR_NAME }}.azurecr.io/tempo-custom:latest


      # Build Grafana (Custom)
      - name: Build and Push Grafana
        uses: docker/build-push-action@v4
        with:
          context: ./monitoring/grafana
          push: true
          tags: ${{ env.ACR_NAME }}.azurecr.io/grafana-custom:${{ github.sha }},${{ env.ACR_NAME }}.azurecr.io/grafana-custom:latest

      # Build Tempo (Custom)
      - name: Build and Push Tempo
        uses: docker/build-push-action@v4
        with:
          context: ./monitoring/tempo
          push: true
          tags: ${{ env.ACR_NAME }}.azurecr.io/tempo-custom:${{ github.sha }},${{ env.ACR_NAME }}.azurecr.io/tempo-custom:latest

      # Deploy Frontend (Update Image Only)
      - name: Deploy Frontend
        run: |
          az containerapp update \
            --name hr-app-frontend \
            --resource-group ${{ env.RG_NAME }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/hr-app-frontend:${{ github.sha }}

      # Deploy Processor (Update Image Only)
      - name: Deploy Processor Agent
        run: |
          az containerapp update \
            --name hr-mcp-processor \
            --resource-group ${{ env.RG_NAME }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/hr-agent-mcp:${{ github.sha }}

      # Deploy Researcher (Update Image Only)
      - name: Deploy Researcher Agent
        run: |
          az containerapp update \
            --name hr-mcp-researcher \
            --resource-group ${{ env.RG_NAME }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/hr-agent-mcp:${{ github.sha }}


      # Deploy Grafana (Update Image Only)
      - name: Deploy Grafana
        run: |
          az containerapp update \
            --name hr-app-grafana \
            --resource-group ${{ env.RG_NAME }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/grafana-custom:${{ github.sha }}

      # Deploy Tempo (Update Image Only)
      - name: Deploy Tempo
        run: |
          az containerapp update \
            --name hr-app-tempo \
            --resource-group ${{ env.RG_NAME }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/tempo-custom:${{ github.sha }}
