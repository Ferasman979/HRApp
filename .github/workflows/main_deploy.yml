name: Deploy HR App Full Stack

on:
  workflow_dispatch:
  push:
    branches: [ "master", "main", "dev" ]
    paths-ignore:
      - 'README.md'

permissions:
  id-token: write
  contents: read

env:
  RG_NAME: "hr-app-rg"
  LOCATION: "canadacentral"
  ACR_NAME: "hrappacrferas999" # Unique name
  ENV_NAME: "hr-app-env"
  # Secrets passed via GitHub Secrets:
  # AZURE_CREDENTIALS, MONGODB_URI, NEXTAUTH_SECRET, GROQ_API_KEY, LLAMA_PARSE_API_KEY

jobs:
  # -----------------------------------------------------------------------------
  # JOB 1: INFRASTRUCTURE & BUILD
  # -----------------------------------------------------------------------------
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 1. SETUP INFRASTRUCTURE
      - name: Setup Azure Resources (RG, ACR, ACA Env)
        uses: azure/CLI@v1
        with:
          inlineScript: |
            # Create RG
            az group create --name ${{ env.RG_NAME }} --location ${{ env.LOCATION }}
            
            # Create ACR
            az acr create --resource-group ${{ env.RG_NAME }} --name ${{ env.ACR_NAME }} --sku Basic --admin-enabled true
            
            # Create Container Apps Environment
            az containerapp env create --name ${{ env.ENV_NAME }} --resource-group ${{ env.RG_NAME }} --location ${{ env.LOCATION }}

      - name: Login to ACR
        run: |
          az acr login --name ${{ env.ACR_NAME }}

      # 2. BUILD PROMETHEUS (Runner-side Build)
      - name: Build & Push Prometheus
        run: |
          docker build -t ${{ env.ACR_NAME }}.azurecr.io/prometheus-custom:latest monitoring/prometheus
          docker push ${{ env.ACR_NAME }}.azurecr.io/prometheus-custom:latest

      # 3. BUILD GRAFANA (Runner-side Build)
      - name: Build & Push Grafana
        run: |
          docker build -t ${{ env.ACR_NAME }}.azurecr.io/grafana-custom:latest monitoring/grafana
          docker push ${{ env.ACR_NAME }}.azurecr.io/grafana-custom:latest

      # 4. DEPLOY MONITORING (To get URLs)
      - name: Deploy Monitoring Apps
        uses: azure/CLI@v1
        with:
          inlineScript: |
            # Deploy Prometheus
            az containerapp create \
              --name hr-app-prometheus \
              --resource-group ${{ env.RG_NAME }} \
              --environment ${{ env.ENV_NAME }} \
              --image ${{ env.ACR_NAME }}.azurecr.io/prometheus-custom:latest \
              --registry-server ${{ env.ACR_NAME }}.azurecr.io \
              --ingress external \
              --target-port 9090 \
              --min-replicas 1 --max-replicas 1

            # Get Prometheus URL
            PROM_URL=$(az containerapp show -n hr-app-prometheus -g ${{ env.RG_NAME }} --query properties.configuration.ingress.fqdn -o tsv)
            echo "PROMETHEUS_URL=https://$PROM_URL" >> $GITHUB_ENV

            # Deploy Grafana
            az containerapp create \
              --name hr-app-grafana \
              --resource-group ${{ env.RG_NAME }} \
              --environment ${{ env.ENV_NAME }} \
              --image ${{ env.ACR_NAME }}.azurecr.io/grafana-custom:latest \
              --registry-server ${{ env.ACR_NAME }}.azurecr.io \
              --ingress external \
              --target-port 3000 \
              --min-replicas 1 --max-replicas 1 \
              --env-vars \
                GF_SECURITY_ALLOW_EMBEDDING=true \
                GF_AUTH_ANONYMOUS_ENABLED=true \
                GF_AUTH_ANONYMOUS_ORG_ROLE=Admin \
                GF_AUTH_DISABLE_LOGIN_FORM=false

            # Get Grafana URL
            GRAF_URL=$(az containerapp show -n hr-app-grafana -g ${{ env.RG_NAME }} --query properties.configuration.ingress.fqdn -o tsv)
            echo "GRAFANA_URL=https://$GRAF_URL" >> $GITHUB_ENV


      # 5. BUILD BACKEND (MCP Agents)
      - name: Build & Push Backend Agents
        run: |
          docker build -t ${{ env.ACR_NAME }}.azurecr.io/hr-agent-mcp:latest hr-agent-mcp
          docker push ${{ env.ACR_NAME }}.azurecr.io/hr-agent-mcp:latest

      - name: Deploy Backend Agents
        uses: azure/CLI@v1
        with:
          inlineScript: |
            # Deploy Processor
            az containerapp create \
              --name hr-mcp-processor \
              --resource-group ${{ env.RG_NAME }} \
              --environment ${{ env.ENV_NAME }} \
              --image ${{ env.ACR_NAME }}.azurecr.io/hr-agent-mcp:latest \
              --registry-server ${{ env.ACR_NAME }}.azurecr.io \
              --command "npm" "run" "worker" \
              --min-replicas 1 --max-replicas 1 \
              --env-vars \
                MONGODB_URI="${{ secrets.MONGODB_URI }}" \
                GROQ_API_KEY="${{ secrets.GROQ_API_KEY }}" \
                GROQ_MODEL="llama-3.3-70b-versatile" \
                LLAMA_PARSE_API_KEY="${{ secrets.LLAMA_PARSE_API_KEY }}"

            # Deploy Researcher
            az containerapp create \
              --name hr-mcp-researcher \
              --resource-group ${{ env.RG_NAME }} \
              --environment ${{ env.ENV_NAME }} \
              --image ${{ env.ACR_NAME }}.azurecr.io/hr-agent-mcp:latest \
              --registry-server ${{ env.ACR_NAME }}.azurecr.io \
              --command "npm" "run" "research" \
              --min-replicas 1 --max-replicas 1 \
              --env-vars \
                MONGODB_URI="${{ secrets.MONGODB_URI }}" \
                GROQ_API_KEY="${{ secrets.GROQ_API_KEY }}" \
                GROQ_MODEL="llama-3.3-70b-versatile" \
                LLAMA_PARSE_API_KEY="${{ secrets.LLAMA_PARSE_API_KEY }}"


      # 6. BUILD & DEPLOY FRONTEND
      - name: Build & Push Frontend
        run: |
          echo "Building Frontend with Grafana URL: ${{ env.GRAFANA_URL }}"
          # Create dockerignore
          echo -e "node_modules\n.next\n.git" > nextjs-hrapp-project/.dockerignore
          
          docker build \
            --build-arg NEXT_PUBLIC_GRAFANA_URL=${{ env.GRAFANA_URL }} \
            -t ${{ env.ACR_NAME }}.azurecr.io/hr-app-frontend:latest \
            nextjs-hrapp-project
            
          docker push ${{ env.ACR_NAME }}.azurecr.io/hr-app-frontend:latest

      - name: Deploy Frontend App
        uses: azure/CLI@v1
        with:
          inlineScript: |
            az containerapp create \
              --name hr-app-frontend \
              --resource-group ${{ env.RG_NAME }} \
              --environment ${{ env.ENV_NAME }} \
              --image ${{ env.ACR_NAME }}.azurecr.io/hr-app-frontend:latest \
              --registry-server ${{ env.ACR_NAME }}.azurecr.io \
              --ingress external \
              --target-port 3000 \
              --min-replicas 1 --max-replicas 2 \
              --env-vars \
                MONGODB_URI="${{ secrets.MONGODB_URI }}" \
                NEXTAUTH_SECRET="${{ secrets.NEXTAUTH_SECRET }}" \
                NEXTAUTH_URL="https://hr-app-frontend.nicemushroom-89003adf.canadacentral.azurecontainerapps.io" \
                NEXT_PUBLIC_GRAFANA_URL=${{ env.GRAFANA_URL }}

