name: Deploy Frontend to ACA

on:
  push:
    branches: [ "main", "dev" ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: hrappdemoredeploy
  RG_NAME: hr-app-rg-demo

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      # Build Frontend
      - name: Build and Push Frontend
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ env.ACR_NAME }}.azurecr.io/hrapp:${{ github.sha }},${{ env.ACR_NAME }}.azurecr.io/hrapp:latest

      # Deploy Frontend
      - name: Deploy Frontend to Container App
        uses: azure/container-apps-deploy-action@v1
        with:
          appSourcePath: ${{ github.workspace }}
          acrName: ${{ env.ACR_NAME }}
          containerAppName: hr-app-frontend
          resourceGroup: ${{ env.RG_NAME }}
          imageToDeploy: ${{ env.ACR_NAME }}.azurecr.io/hrapp:${{ github.sha }}
