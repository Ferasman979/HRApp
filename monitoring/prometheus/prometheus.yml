global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'hrs-frontend'
    scheme: http
    static_configs:
      - targets: ['hr-app-frontend:3000']
    metrics_path: /api/metrics

  - job_name: 'hrs-processor'
    scheme: http
    static_configs:
      - targets: ['hr-mcp-processor:9090']
    metrics_path: /metrics

  - job_name: 'hrs-researcher'
    scheme: http
    static_configs:
      - targets: ['hr-mcp-researcher:9090']
    metrics_path: /metrics

